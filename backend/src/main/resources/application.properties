# ============================================================
#  Configuración de la Aplicación
# ============================================================

spring.application.name=unidos-adopcion

# Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/unidos_animales?useSSL=false&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=tu_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Puerto
server.port=8080

# JWT
app.jwt.secret=UnidosPorLosAnimalesSecretKey2024ChileAdopcionSegura
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500
